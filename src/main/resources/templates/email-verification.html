<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: #f5f7fb;
            margin: 0;
            padding: 0;
            font-family: "Roboto", Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
            text-align: left;
        }

        .hello {
            font-size: 16px;
            color: #444;
            margin-bottom: 20px;
        }

        .code-box {
            margin: 20px 0;
            background: #0066ff;
            padding: 18px;
            color: #fff;
            text-align: center;
            font-size: 28px;
            letter-spacing: 4px;
            border-radius: 10px;
            font-weight: bold;
        }

        .expire {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-top: 30px;
        }

        @media(max-width:600px) {
            .container { padding: 20px; }
            .code-box { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Vérification de votre compte</h1>


    <p class="hello">
        Bonjour <b th:text="${name}"></b>,<br><br>
        Voici votre code de vérification :
    </p>

    <div class="code-box" th:text="${code}"></div>

    <p class="expire">Ce code expire dans 10 minutes.</p>

    <div class="footer">
        support technique — Tous droits réservés.
    </div>
</div>

</body>
</html>
