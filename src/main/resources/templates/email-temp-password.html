<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #f5f7fb; font-family: Roboto, sans-serif; padding: 0; margin: 0; }
        .container {
            max-width: 600px; background: #fff; border-radius: 12px;
            margin: 30px auto; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }
        h1 { font-size: 22px; color: #333; }
        .pw-box {
            background: #e53935; color: white; padding: 14px;
            font-size: 24px; text-align: center; border-radius: 10px; font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Réinitialisation du mot de passe</h1>

    <p>Bonjour <b th:text="${name}"></b>,<br><br>
        Voici votre mot de passe temporaire :</p>

    <div class="pw-box" th:text="${password}"></div>

    <p style="margin-top:20px; color:#666;">Il expire dans 1 heure.</p>

    <p style="font-size:14px; text-align:center; color:#999;">
        support technique
    </p>
</div>
</body>
</html>
